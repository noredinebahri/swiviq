# ============================================
# swiviq.com — Angular SSR (4002) + API Express (4001)
# VPS : /etc/nginx/sites-enabled/swiviq
# ============================================
# --------------------------------------------
# www.swiviq.com -> swiviq.com (hôte canonique)
#
# Sans ce bloc, les deux hôtes servaient l'application et le visiteur arrivé
# par www restait sur www : toute page chargée là avait pour origine
# https://www.swiviq.com et ses appels API partaient vers https://swiviq.com,
# soit une requête inter-origines refusée par le navigateur. Un seul hôte
# vivant = plus de double origine possible (et un canonique unique pour le SEO).
# --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.swiviq.com;

    ssl_certificate /etc/letsencrypt/live/swiviq.com/fullchain.pem;  # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/swiviq.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://swiviq.com$request_uri;
}

server {
    server_name swiviq.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # API Express
    location /api/ {
        # Données vivantes : jamais conservées par le navigateur. Doublonne
        # l'en-tête posé par Express — si l'un des deux saute, l'autre tient.
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Images déposées depuis l'admin (photos produits) — servies par le
    # backend :4001 sous /uploads, avec son propre max-age de 7 jours.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers construits par Angular : leur nom porte une empreinte, le
    # max-age d'un an posé par le serveur SSR est correct — on le laisse
    # passer tel quel, sans y superposer le no-cache du HTML.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|svg|png|jpe?g|gif|webp|avif|ico|webmanifest|xml|txt)$ {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Angular SSR — pages HTML uniquement (les assets sont
    # interceptés par le bloc au-dessus).
    location / {
        # Le document se revalide à chaque visite (no-cache ≠ no-store : le
        # navigateur garde une copie mais doit demander avant de la servir).
        # Sans cet en-tête, il ne portait qu'un ETag et le navigateur pouvait
        # resservir un HTML dont les données embarquées dataient du build.
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/swiviq.com/fullchain.pem;  # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/swiviq.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS, et directement sur l'hôte canonique : viser $host aurait
# renvoyé www en http vers www en https, puis vers l'apex — un saut de trop.
server {
    listen 80;
    listen [::]:80;
    server_name swiviq.com www.swiviq.com;
    return 301 https://swiviq.com$request_uri;
}
